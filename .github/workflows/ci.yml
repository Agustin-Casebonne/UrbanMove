name: CI 

on:
  push: #cada vez que se haga un push a la rama main, se ejecutara el workflow
    branches: [main]
  pull_request: #rama con pull request

permissions:
  contents: read #en las acciones de github, se necesita permisos para leer el contenido del repositorio no modificarlo

jobs: # se corren varios jobs en paralelo, cada uno con un nombre y un conjunto de pasos
  lint: # lo que hace es chequear que el codigo cumpla con las reglas de estilo y buenas practicas, en este caso se usa ruff
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - run: ruff format --check .

  test: #10 máquinas para cada servicio 
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # si uno falla los otros siguen corriendo, no se detiene el workflow
      matrix:
        service: [identity, profiles, inventory, availability, reservations, rides, history, maintenance, relocation, analytics] # lista de servicios a probar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: services/${{ matrix.service }} #se mete en la carpeta del servicio que se esta probando
        env:
          PYTHONPATH: ../../shared:.
        run: python -m pytest -q --junitxml=../../test-results-${{ matrix.service }}.xml #pytest encuentro por si solo los test del directorio
      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }} #nombre del artefacto que se sube a github
          path: test-results-${{ matrix.service }}.xml #ruta al archivo de resultados

  docker: #prueba que se pueda construir la imagen de docker de cada servicio, si no se puede construir la imagen, el workflow falla
    name: Docker build ${{ matrix.service }}
    needs: [lint, test] # esperar a que los jobs de lint y test terminen antes de ejecutar este job
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, profiles, inventory, availability, reservations, rides, history, maintenance, relocation, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t urbanmove-${{ matrix.service }}:${{ github.sha }} .
