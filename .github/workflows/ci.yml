name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, profiles, inventory, availability, reservations, rides, history, maintenance, relocation, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ../../shared:.
        run: python -m pytest -q --junitxml=../../test-results-${{ matrix.service }}.xml
      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: test-results-${{ matrix.service }}.xml

  docker:
    name: Docker build ${{ matrix.service }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, profiles, inventory, availability, reservations, rides, history, maintenance, relocation, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t urbanmove-${{ matrix.service }}:${{ github.sha }} .
