# UrbanMove - entorno local completo
# Uso (desde la raíz del repo):  docker compose -f infra/docker-compose.yml up --build
#
# - localstack: simula AWS (SNS, SQS, S3, Lambda). Al arrancar ejecuta
#   infra/localstack/init-aws.sh, que crea el bus de eventos, las colas,
#   la DLQ y el bucket del Data Lake.
# - Cada microservicio tiene su propio contenedor y su propio volumen de datos.
#   Swagger de cada uno: http://localhost:<puerto>/docs

x-service-env: &service-env
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test        # credenciales falsas de LocalStack, no son secretos
  AWS_SECRET_ACCESS_KEY: test
  EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:urbanmove-events

services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,s3,lambda,logs,iam
      DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sns list-topics | grep -q urbanmove-events"]
      interval: 5s
      timeout: 5s
      retries: 30

  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    ports:
      - "8001:8000"
    environment:
      <<: *service-env
    volumes:
      - identity-data:/data
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  profiles:
    build:
      context: ..
      dockerfile: services/profiles/Dockerfile
    ports:
      - "8002:8000"
    environment:
      <<: *service-env
    volumes:
